<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>

    <script>
      const basePath = '/JoaquinBarrera.github.io/';

      const requestedPath =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      window.location.replace(
        basePath + '?p=' + encodeURIComponent(requestedPath)
      );
    </script>
  </head>

  <body>
    Redirecting...
  </body>
</html>
